<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-4">
        <h1 class="mb-4">Registration Form</h1>

        <form class="needs-validation" novalidate>
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="firstName" class="form-label">First Name</label>
                    <input type="text" class="form-control" id="firstName" required maxlength="50">
                    <div class="valid-feedback">Looks good!</div>
                    <div class="invalid-feedback">First name is required.</div>
                </div>

                <div class="col-md-6">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="lastName" required maxlength="50">
                    <div class="valid-feedback">Looks good!</div>
                    <div class="invalid-feedback">Last name is required.</div>
                </div>

                <div class="col-12">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                    <div class="valid-feedback">Looks good!</div>
                    <div class="invalid-feedback">Enter a valid email.</div>
                </div>

                <div class="col-md-6">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" minlength="6" required>
                    <div class="form-text">Minimum 6 characters.</div>
                    <div class="valid-feedback">Looks good!</div>
                    <div class="invalid-feedback">Password must be at least 6 characters.</div>
                </div>

                <div class="col-md-6">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" minlength="6" required>
                    <div class="valid-feedback">Passwords match!</div>
                    <div class="invalid-feedback">Passwords must match.</div>
                </div>

                <div class="col-12">
                    <label class="form-label d-block">Gender</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="male" value="male" required>
                        <label class="form-check-label" for="male">Male</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="female" value="female" required>
                        <label class="form-check-label" for="female">Female</label>
                    </div>
                    <div class="invalid-feedback">Choose a gender.</div>
                </div>

                <div class="col-12">
                    <label class="form-label d-block">Hobbies</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="sport" value="sport">
                        <label class="form-check-label" for="sport">Sport</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="music" value="music">
                        <label class="form-check-label" for="music">Music</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="reading" value="reading">
                        <label class="form-check-label" for="reading">Reading</label>
                    </div>
                </div>

                <div class="col-md-6">
                    <label for="country" class="form-label">Country</label>
                    <select class="form-select" id="country" required>
                        <option value="" selected disabled>Choose country</option>
                        <option>Kazakhstan</option>
                        <option>Uzbekistan</option>
                        <option>Kyrgyzstan</option>
                        <option>Other</option>
                    </select>
                    <div class="valid-feedback">Looks good!</div>
                    <div class="invalid-feedback">Choose a country.</div>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Submit</button>
                    <button type="reset" class="btn btn-secondary">Reset</button>
                </div>
            </div>
        </form>

        <p class="mt-4"><a href="index.html">Back</a></p>
    </div>

    <script>
        const form = document.querySelector('.needs-validation');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');

        function checkPasswords() {
            if (confirmPassword.value !== password.value) {
                confirmPassword.setCustomValidity('Passwords do not match');
            } else {
                confirmPassword.setCustomValidity('');
            }
        }

        password.addEventListener('input', checkPasswords);
        confirmPassword.addEventListener('input', checkPasswords);

        function showValidation() {
            const fields = form.querySelectorAll('input[required], select[required]');

            fields.forEach(function (field) {
                field.classList.remove('is-valid', 'is-invalid');
                field.classList.add(field.checkValidity() ? 'is-valid' : 'is-invalid');
            });
        }

        form.addEventListener('submit', function (event) {
            event.preventDefault();
            checkPasswords();
            showValidation();
        });

        form.addEventListener('reset', function () {
            const fields = form.querySelectorAll('.is-valid, .is-invalid');
            fields.forEach(function (field) {
                field.classList.remove('is-valid', 'is-invalid');
            });
            confirmPassword.setCustomValidity('');
        });
    </script>
</body>
</html>
